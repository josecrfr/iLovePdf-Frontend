<div class="split-container">

  <h1>Dividir PDF</h1>
  <p>Separa tu PDF en varios archivos o extrae páginas</p>

  <app-ad-banner></app-ad-banner>

  <!-- UPLOAD -->
  <div class="upload-box">

    <input type="file" accept="application/pdf" (change)="onFileSelected($event)" />

    <p *ngIf="!file">Sube tu archivo PDF</p>

    <div *ngIf="file">
      <p><strong>Archivo:</strong> {{ file.name }}</p>
      <p><strong>Tipo:</strong> {{ file.type }}</p>
      <p><strong>Tamaño:</strong> {{ file.size / 1024 | number:'1.0-0' }} KB</p>
    </div>

  </div>

  <!-- OPTIONS -->
  <div class="split-options">

    <label>Tipo de división:</label>

    <select [(ngModel)]="mode">

      <option value="PAGES">Extraer páginas</option>
      <option value="EVERY_PAGE">Dividir cada página</option>
      <option value="RANGE">Rango personalizado</option>

    </select>

  </div>

  <!-- RANGE -->
  <div class="range-box" *ngIf="mode === 'PAGES' || mode === 'RANGE'">

    <input
      type="text"
      placeholder="Ej: 1-3, 5, 8-10"
      [(ngModel)]="range"
    />

  </div>

  <!-- BUTTON -->
  <button class="action-btn" (click)="splitPdf()" [disabled]="!file">
    Dividir PDF
  </button>

</div>
